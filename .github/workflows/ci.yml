name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/python/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r tools/python/requirements.txt

      - name: Validate storefront
        run: npm run validate
