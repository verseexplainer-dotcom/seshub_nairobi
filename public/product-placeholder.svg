<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="SES ICT HUB product image placeholder">
  <defs>
    <linearGradient id="pageBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="55%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#c7e5ff" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f8fbff" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="device" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.35" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pageBg)" />
  <rect width="800" height="600" fill="url(#dots)" opacity="0.45" />
  <rect width="800" height="600" fill="url(#glow)" />

  <g filter="url(#shadow)">
    <rect x="92" y="88" width="616" height="424" rx="36" fill="url(#panel)" stroke="#bfdbfe" stroke-width="2" />
  </g>

  <text x="128" y="158" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" fill="#0ea5e9" fill-opacity="0.08" letter-spacing="10">
    SES
  </text>

  <g>
    <rect x="136" y="170" width="304" height="210" rx="28" fill="url(#device)" />
    <rect x="160" y="194" width="256" height="156" rx="20" fill="#eff6ff" fill-opacity="0.92" stroke="#bae6fd" stroke-width="2" />
    <rect x="212" y="368" width="152" height="14" rx="7" fill="#0f172a" fill-opacity="0.16" />
    <rect x="242" y="386" width="92" height="12" rx="6" fill="#0f172a" fill-opacity="0.12" />
    <circle cx="288" cy="271" r="34" fill="#38bdf8" fill-opacity="0.18" />
    <path d="M256 304l26-34 24 22 26-36 34 48H256z" fill="#38bdf8" fill-opacity="0.7" />
  </g>

  <g>
    <rect x="486" y="162" width="124" height="124" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" />
    <image href="/site-assets/ses-logo-2500px-by-2500px.svg" x="506" y="182" width="84" height="84" preserveAspectRatio="xMidYMid meet" />

    <text x="486" y="344" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#0f172a">
      SES ICT HUB
    </text>
    <text x="486" y="378" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">
      Product image coming soon
    </text>

    <rect x="486" y="408" width="146" height="34" rx="17" fill="#e0f2fe" />
    <text x="559" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0369a1">
      Trusted electronics
    </text>
  </g>
</svg>
